# Frontmatter governance for the LLM-wiki knowledge bundle and what is built
# from it.
#
# Two zones, governed for different reasons. `docs/llm-wiki/` is the bundle:
# three Rules split by provenance, one per kind. `docs/presentations/` sits
# outside the bundle and holds compositions — what gets assembled out of the
# corpus and said to a room. The corpus refuses to store pedagogy, so the
# composition that carries it lives elsewhere and is governed on its own terms.
#
# Governance is still opt-in by path. Everything else in the repository is
# deliberately invisible to the harness. A file no Rule names is not "passing"
# — it is ungoverned, and that is a choice made per directory rather than for
# the whole tree.
#
# Rules are first-match in written order. Nothing merges and nothing is
# inherited, so a narrow Rule placed under a broader one silently governs zero
# files. Keep the narrowest Rule first as this file grows.

frontmatter:
  rules:
    - ruleId: content-block
      path:
        - docs/llm-wiki/content-blocks/**/*.md
      # `!` negation inside `path` is silently ignored — exclusion only works
      # through this sibling key. OKF reserves both filenames and forbids
      # frontmatter in `index.md`, so any Rule asking for `type` would fail on
      # every one of them.
      excludeFiles:
        - '**/index.md'
        - '**/log.md'
      intent: >-
        A content-block is my own synthesis of one scoped topic, written to be
        pulled into a workshop later without its surroundings. It has to say who
        drafted it, when, and how long I am willing to stand behind it, because
        a block that outlives its own correctness is worse than a missing one —
        I will reuse it in front of a room and never notice it went wrong.
      fields:
        type:
          presence: required
          allowed:
            - value: content-block
              intent: >-
                The directory already says this is a content-block; the field
                repeats it so a document that gets moved is caught rather than
                silently regoverned by whichever Rule its new home matches.
        title:
          presence: required
        description:
          presence: required
          maxLength: 200
          intent: >-
            One sentence a retrieval step can rank without opening the file. The
            cap is there to stop it drifting into a summary of the whole block.
        tags:
          presence: required
          minItems: 1
          intent: >-
            Topic lives here, never in the directory tree. Directories carry the
            one dimension the Rule selector can see; tags carry the cross-cutting
            ones it cannot.
        generated.by:
          presence: required
          format: actor
          intent: >-
            Whoever drafted this, named as `<producer>/<version>` for a tool or
            `human:<id>` for a person. An unattributed draft is one I cannot
            judge three months later.
        generated.at:
          presence: required
          format: datetime
        status:
          presence: required
          allowed:
            - value: draft
              intent: Drafted, not yet reviewed by me. Not eligible for generation.
            - value: stable
              intent: I have read it and I stand behind it.
            - value: deprecated
              intent: Kept for history, must not be pulled into new material.
        stale_after:
          presence: required
          format: datetime
          intent: >-
            The instant after which I stop trusting this without re-reading it.
            Deliberately short at first and lengthened each time I verify, so a
            block earns its longer horizon instead of being granted one.
        # No `presence` key here on purpose. `presence` is only ever read as
        # `required` or `forbidden`; writing `optional` parses fine and does
        # nothing, which reads as intent and carries none. Omitting it is what
        # actually means "optional": nothing but `presence` may speak about a
        # field that is absent, while `allowed` still binds it when present.
        verified.by:
          allowed:
            - value: human:han
              intent: >-
                Verification is mine alone — this content goes out under my name.
                An agent may draft, but only I can promote a draft to stable, and
                `verified.by` is the record that I actually read it.

    - ruleId: reference
      path:
        - docs/llm-wiki/references/**/*.md
      excludeFiles:
        - '**/index.md'
        - '**/log.md'
      intent: >-
        A reference is someone else's knowledge restated in my words, so the
        whole of its worth is that a reader can get back to the original and
        check me. It has to name what it restates and everything it leans on,
        because a restatement I cannot trace is indistinguishable from
        something I made up — and passing that off as research is the one
        mistake in this corpus I could not walk back.
      fields:
        type:
          presence: required
          allowed:
            - value: reference
              intent: >-
                The directory already says this is a reference; the field
                repeats it so a document that gets moved is caught rather than
                silently regoverned by whichever Rule its new home matches.
        title:
          presence: required
        description:
          presence: required
          maxLength: 200
          intent: >-
            One sentence a retrieval step can rank without opening the file. The
            cap is there to stop it drifting into a summary of the whole page.
        tags:
          presence: required
          minItems: 1
          intent: >-
            Topic lives here, never in the directory tree. Directories carry the
            one dimension the Rule selector can see; tags carry the cross-cutting
            ones it cannot.
        resource:
          presence: required
          format: uri
          intent: >-
            The canonical address of the work being restated. A reference stands
            on one primary work, and without that address the page is a summary
            of nothing in particular — nobody can hold my restatement against
            the thing it restates.
        sources:
          presence: required
          minItems: 1
          intent: >-
            Everything this page leans on, listed even when the primary work is
            the only entry. The list is required in its own right because a
            per-entry rule says nothing at all when the list itself is missing,
            so this key is what actually makes a reference sourced.
        sources[].resource:
          presence: required
          format: uri
          intent: >-
            Every source has to be followable. An entry carrying a title and no
            address is a citation I cannot check in three months, which is the
            failure this whole kind exists to prevent.
        generated.by:
          presence: required
          format: actor
          intent: >-
            Whoever drafted this, named as `<producer>/<version>` for a tool or
            `human:<id>` for a person. An unattributed draft is one I cannot
            judge three months later.
        generated.at:
          presence: required
          format: datetime
        status:
          presence: required
          allowed:
            - value: draft
              intent: Drafted, not yet reviewed by me. Not eligible for generation.
            - value: stable
              intent: I have read it and I stand behind it.
            - value: deprecated
              intent: Kept for history, must not be pulled into new material.
          intent: >-
            Stated outright on every document, because OKF reads an absent
            `status` as `stable` — the one default that would promote an
            unreviewed draft by saying nothing.
        stale_after:
          presence: required
          format: datetime
          intent: >-
            The instant after which I stop trusting this without re-reading it.
            A restatement decays with the work it restates, so this is the date
            I go back to the source rather than to my own page.
        # No `presence` key here on purpose — see the note on the Rule above.
        verified.by:
          allowed:
            - value: human:han
              intent: >-
                Verification is mine alone — this content goes out under my name.
                An agent may draft, but only I can promote a draft to stable, and
                `verified.by` is the record that I actually read it.

    - ruleId: story
      path:
        - docs/llm-wiki/stories/**/*.md
      excludeFiles:
        - '**/index.md'
        - '**/log.md'
      intent: >-
        A story is something I was in the room for, and its whole worth is that
        it happened to me — there is nothing to check it against but my word,
        which is exactly why it persuades. So it must not reach for anything
        else. A story wearing citations is the one failure in this corpus I
        could not talk my way out of: dressing experience up as research, in
        front of a room, under my own name.
      fields:
        type:
          presence: required
          allowed:
            - value: story
              intent: >-
                The directory already says this is a story; the field repeats it
                so a document that gets moved is caught rather than silently
                regoverned by whichever Rule its new home matches.
        title:
          presence: required
        description:
          presence: required
          maxLength: 200
          intent: >-
            One sentence a retrieval step can rank without opening the file. The
            cap is there to stop it drifting into a retelling of the whole story.
        tags:
          presence: required
          minItems: 1
          intent: >-
            Topic lives here, never in the directory tree. Directories carry the
            one dimension the Rule selector can see; tags carry the cross-cutting
            ones it cannot.
        # The two forbidden keys are the whole point of this kind, and they are
        # forbidden rather than merely unrequired: an absent field says nothing,
        # while a rejected one says the corpus will not let this happen.
        sources:
          presence: forbidden
          intent: >-
            A story has no sources, because I am the source. If I find myself
            wanting to cite something here, what I am actually writing is a
            content-block that leans on my experience — and it belongs in that
            directory, under a Rule that will hold me to naming what it leans on.
        resource:
          presence: forbidden
          intent: >-
            There is no canonical work behind a story to point at. A `resource`
            here would name something a reader could go and read instead, and
            the moment that exists this stopped being lived experience.
        generated.by:
          presence: required
          format: actor
          intent: >-
            Whoever drafted this, named as `<producer>/<version>` for a tool or
            `human:<id>` for a person. An unattributed draft is one I cannot
            judge three months later. On a story it records who wrote the prose,
            never whose experience it is — that is mine by the kind itself.
        generated.at:
          presence: required
          format: datetime
        status:
          presence: required
          allowed:
            - value: draft
              intent: Drafted, not yet reviewed by me. Not eligible for generation.
            - value: stable
              intent: I have read it and I stand behind it.
            - value: deprecated
              intent: Kept for history, must not be pulled into new material.
          intent: >-
            Stated outright on every document, because OKF reads an absent
            `status` as `stable` — the one default that would promote an
            unreviewed draft by saying nothing.
        stale_after:
          presence: required
          format: datetime
          intent: >-
            What happened does not decay, but the telling does. This is the date
            I re-read it and ask whether the lesson still holds and whether I
            would still tell it this way, because an anecdote that has quietly
            stopped being true of my current practice is worse in a room than no
            anecdote at all.
        # No `presence` key here on purpose — see the note on the first Rule.
        verified.by:
          allowed:
            - value: human:han
              intent: >-
                Verification is mine alone — this content goes out under my name.
                An agent may draft, but only I can promote a draft to stable, and
                `verified.by` is the record that I actually read it.

    # Outside the bundle, deliberately. Everything above is corpus; this is what
    # gets built out of it. The corpus will not store pedagogy — duration,
    # sequencing, cut order — so the artifact that carries pedagogy needs a
    # directory of its own, and the moment it carries my name it needs governing
    # too.
    - ruleId: presentation
      path:
        - docs/presentations/**/*.md
      excludeFiles:
        - '**/index.md'
        - '**/log.md'
      intent: >-
        A presentation is a composition: a talk assembled out of corpus
        documents, carrying the pedagogy the corpus deliberately refuses to
        store. It is the only thing here an audience ever sees, and it goes out
        under my name and onto a recording, so it has to name what it was built
        from and say plainly whether a human has read it. A script that leans on
        unpromoted drafts and does not admit it is the exact failure this talk
        is about, performed live.
      fields:
        type:
          presence: required
          allowed:
            - value: presentation
              intent: >-
                The directory already says this is a presentation; the field
                repeats it so a document that gets moved is caught rather than
                silently regoverned by whichever Rule its new home matches.
        title:
          presence: required
        description:
          presence: required
          maxLength: 200
          intent: >-
            One sentence a retrieval step can rank without opening the file. The
            cap is there to stop it drifting into an abstract of the whole talk.
        tags:
          presence: required
          minItems: 1
          intent: >-
            Topic lives here, never in the directory tree. Directories carry the
            one dimension a Rule selector can see; tags carry the cross-cutting
            ones it cannot.
        sources:
          presence: required
          minItems: 1
          intent: >-
            Every document this talk was assembled from, listed. The trust model
            only lets a composition draw on documents that are stable and
            verified, and that is uncheckable unless the composition names what
            it drew on. A deck whose provenance is unstated is the thing this
            particular deck spends three minutes warning the room about.
        sources[].resource:
          presence: required
          format: uri
          intent: >-
            Every source followable — a repo-relative path for a corpus
            document, a URL for anything outside it. An entry with a title and
            no address is a citation I cannot check in the week before I stand
            up and repeat it.
        generated.by:
          presence: required
          format: actor
          intent: >-
            Whoever drafted this, named as `<producer>/<version>` for a tool or
            `human:<id>` for a person. It matters more here than anywhere in the
            corpus: these words end up in my mouth, in a room, on a recording,
            and I should never be unsure which of them I wrote.
        generated.at:
          presence: required
          format: datetime
        status:
          presence: required
          allowed:
            - value: draft
              intent: Drafted, not yet read by me. Must not be delivered.
            - value: stable
              intent: I have read it and I stand behind every claim in it.
            - value: deprecated
              intent: >-
                Kept for history — a talk already given, or one I would no
                longer give.
          intent: >-
            Stated outright, because OKF reads an absent `status` as `stable`.
            The one default that must never happen here is an unread script
            promoting itself in the week I am due to deliver it.
        stale_after:
          presence: required
          format: datetime
          intent: >-
            The instant this stops being deliverable without a re-read. A talk
            decays faster than anything in the corpus, because it is pinned to a
            date, an audience, and whatever happened to be true of the tooling
            that week.
        # No `presence` key here on purpose — see the note on the first Rule.
        verified.by:
          allowed:
            - value: human:han
              intent: >-
                Verification is mine alone — this content goes out under my name
                and onto a recording. An agent may draft the script, but only I
                can promote it, and `verified.by` is the record that I read the
                thing I am about to say out loud.
