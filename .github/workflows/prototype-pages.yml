name: Prototype Pages

# Publishes the THROWAWAY Starlight prototype to GitHub Pages.
#
# Triggered by pushes to `prototype/**`, never by `main`. A manual trigger alone
# was unusable: GitHub only registers `workflow_dispatch` for workflows that
# already exist on the default branch, and `main` takes no direct commits here,
# so there was no way to dispatch this at all (`gh workflow run` returned
# "workflow not found on the default branch"). A push trigger runs the
# definition from the pushed branch and leaves `main` untouched, so the original
# intent holds: no push path can auto-deploy `main`.
#
# Deploying also needs `prototype/**` in the `github-pages` environment's
# allowed deployment branches, or `deploy` stops at the environment gate while
# `build` reports success.
on:
  push:
    branches: ['prototype/**']
  workflow_dispatch:

# The deploy needs to publish Pages and mint an OIDC token; nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `base` must match the repo name for a project page; build:pages sets it.
      - name: Build prototype
        uses: withastro/action@v6
        with:
          path: ./prototype/starlight-presentation
          build-cmd: npm run build:pages

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
